<!-- The plugin's icon, skills/.claude-plugin/icon.png: a phone with its safe area outlined and a card
     whose corner is concentric with the display's. Filled shapes only, so any SVG renderer draws it.
     Render with
     magick -background '#0b1220' assets/plugin-icon.svg -flatten -alpha off -depth 8 PNG24:skills/.claude-plugin/icon.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#0b1220"/>
  <rect x="302" y="82" width="420" height="860" rx="94" fill="#e2e8f0"/>
  <rect x="322" y="102" width="380" height="820" rx="74" fill="#1e293b"/>
  <rect x="452" y="118" width="120" height="36" rx="18" fill="#020617"/>
  <rect x="342" y="176" width="340" height="540" rx="12" fill="#38bdf8"/>
  <rect x="352" y="186" width="320" height="520" rx="4" fill="#1d3b55"/>
  <rect x="342" y="742" width="340" height="160" rx="54" fill="#38bdf8"/>
</svg>
