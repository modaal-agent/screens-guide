name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Rules lane ───────────────────────────────────────────────────
  # AGENTS.md is the agent rules file and CLAUDE.md a byte-identical copy of it.
  # A checkout and one command, so the job reports in seconds.
  rules:
    name: Agent rules files are byte-identical
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: AGENTS.md and CLAUDE.md are byte-identical
        # Fix a failure with `cp AGENTS.md CLAUDE.md`.
        run: bash scripts/check-agent-rules.sh

  # ── Skills and specs lane ────────────────────────────────────────
  # Every skill under skills/, the two plugin manifests, and every spec's
  # references. bash, find, grep, awk, perl and python3, all on ubuntu-latest,
  # so it needs no toolchain and reports in seconds.
  skills:
    name: Skills, plugin manifests and spec references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Skills, manifests and specs
        run: scripts/check-skills.sh

      - name: Each check red against a seeded violation
        run: scripts/check-skills.sh --self-test
